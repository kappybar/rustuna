site_name: Rustuna Documentation
site_description: Fast hyperparameter optimization library written in Rust
site_url: https://optuna.github.io/rustuna/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source

nav:
  - Home: index.md
  - Tutorial:
      - Getting Started: tutorial/getting-started.md
  - API Reference:
      - rustuna: api/rustuna.md
      - rustuna.Study: api/study.md
      - rustuna.Trial: api/trial.md
      - rustuna.Sampler: api/sampler.md
      - rustuna.Storage: api/storage.md
      - rustuna.TrialQueue: api/trial_queue.md
      - rustuna.Importance: api/importance.md
      - rustuna.Distribution: api/distribution.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
