site_name: Rustuna Documentation
site_description: Fast hyperparameter optimization library written in Rust
site_url: https://optuna.github.io/rustuna/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/images/optuna-white-square.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source

nav:
  - Home: index.md
  - Migrating from Optuna: migration.md
  - Tutorial:
      - Getting Started: tutorial/getting-started.md
  - API Reference:
      - rustuna: api/rustuna.md
      - rustuna.study: api/study.md
      - rustuna.trial: api/trial.md
      - rustuna.samplers: api/samplers.md
      - rustuna.storages: api/storages.md
      - rustuna.trial_queue: api/trial_queue.md
      - rustuna.distributions: api/distributions.md
      - rustuna.importance: api/importance.md
      - rustuna.converter: api/converter.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
